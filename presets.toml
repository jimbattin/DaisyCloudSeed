# CloudSeed reverb presets for the Terrarium pedal.
#
# This file is compiled into the firmware image (see src/presets_toml.s) and
# parsed once at boot. Edit values here, then rebuild and reflash:
#     make && make program-dfu
# Reflashing any change to this file (comments included) changes the firmware
# image, which discards every preset saved on the pedal (FS1 held 5 s).
#
# Rules enforced by the parser. `make` refuses to build firmware from a file that
# breaks one; if such a file ever reached the pedal it would stop boot and blink
# both LEDs at 5 Hz:
#   * Preset order is the order below. The index is stored in QSPI flash, so
#     reordering or deleting presets invalidates saved settings (bump
#     SETTINGS_VERSION in src/pedal_storage.cpp in the same change).
#   * 1 to 16 [[preset]] tables. Each needs a non-empty name of at most 31
#     bytes and blinks = 1..20. led_on_ms, led_off_ms and led_pause_ms are
#     optional whole numbers 0..60000 (300 and 300.0 both work; defaults
#     150 / 150 / 5000).
#   * Every parameter value must be a number within 0.0-1.0; anything else,
#     nan included, is rejected.
#   * Every [preset.params.*] group must contain exactly the keys listed for it;
#     a key in the wrong group, an unknown key, or a missing key is an error.
#   * LineCount must NOT appear: it is driven live by the "delay_lines.max"
#     toggle target, which selects default_delay_lines (off) or max_delay_lines (on).
#   * default_delay_lines and max_delay_lines are whole numbers 1..5, both
#     required, and default_delay_lines must not exceed max_delay_lines.
#   * Every preset needs a [preset.knob_map] with all twelve knobN_a / knobN_b
#     keys. Each value is a quoted "group.Parameter" naming a parameter from that
#     preset's own [preset.params.<group>] section, or "reverse.delay" for the
#     reverse-delay window length ([preset.params.reverse] delay). Secondary (_b) functions are reachable by
#     holding the preset footswitch (FS2) down while turning the knob.
#   * Every preset needs a [preset.toggle_map] with all eight toggleN_a /
#     toggleN_b keys (N = 1..4 = SWITCH_1..SWITCH_4), each naming a TOGGLE TARGET
#     from the list below; _b is written by flips made while FS2 is held. Toggles
#     are parked like knobs: after power-up, a preset change or a bank change the
#     preset's stored values apply and a lever writes only once it is flipped,
#     then sets its target to the lever position (up = on).
#   * input.HighPass / input.LowPass are enabled automatically the first time
#     their knob is turned (unless a toggle targets that filter's enable); every
#     other switch-gated parameter (shelves, cutoff, the diffusers) must be
#     enabled in [preset.params.*] or by a toggle to be audible.
#
# Every parameter value is normalized 0.0-1.0. The engine maps it to the real
# range noted in the comments below.
#
# PARAMETER REFERENCE (values are normalized 0.0-1.0; the engine maps them to the
# real ranges shown here). Each preset repeats these groups with its own values.
#
#   [preset.params.input]  Input stage: pre-delay and the input filters feeding the whole reverb.
#     InputMix        stereo input blend; unused in this mono fork, kept so the value set stays complete
#     PreDelay        delay before the reverb, 0-1000 ms
#     HiPassEnabled   on when >= 0.5: enables the input high-pass
#     HighPass        input high-pass cutoff, 20-1000 Hz
#     LowPassEnabled  on when >= 0.5: enables the input low-pass
#     LowPass         input low-pass cutoff, 400-20000 Hz
#
#   [preset.params.early]  Early reflections: the multi-tap delay that follows the input stage.
#     TapCount   number of early-reflection taps, 1-50
#     TapLength  time spread of the taps, 0-500 ms
#     TapGain    gain of the tap bank, 2-decade curve
#     TapDecay   how fast tap gain falls across the bank, 0-1
#     isReverse  Bloom: on when >= 0.5, reverses the early tap gain order (default SWITCH_2 target)
#
#   [preset.params.early_diffusion]  Early diffusion: allpass chain that smears the early reflections.
#     DiffusionEnabled         on when >= 0.5: runs the early allpass diffuser
#     DiffusionStages          allpass stages in series, 1-2
#     DiffusionDelay           delay per allpass stage, 10-100 ms
#     DiffusionFeedback        allpass feedback, 0-1
#     EarlyDiffusionModAmount  allpass delay modulation depth, 0-2.5 ms
#     EarlyDiffusionModRate    allpass delay modulation rate, 0-5 Hz
#
#   [preset.params.late]  Late reverb lines: the feedback delay network that generates the tail.
#     LineDelay       base delay per line, 20-1000 ms; each line scales it by a seeded 0.5-1.5x (line count comes from the "delay_lines.max" toggle target, not this file)
#     LineDecay       tail decay time, 0.05-60 s
#     LineModAmount   line delay modulation depth, 0-2.5 ms
#     LineModRate     line delay modulation rate, 0-5 Hz
#     LateStageTap    on when >= 0.5: each line outputs from before its delay (after the late
#                     diffuser, which then runs first), so the tail starts one LineDelay sooner;
#                     off: output after the delay
#     Interpolation   on when >= 0.5: fractional-delay interpolation in the late-diffuser allpasses
#                     (more CPU). The line delays and the early diffuser always interpolate, so
#                     this has no effect while LateDiffusionEnabled is off
#
#   [preset.params.late_diffusion]  Late diffusion: allpass chain inside each delay line.
#     LateDiffusionEnabled    on when >= 0.5: runs the per-line allpass diffuser
#     LateDiffusionStages     allpass stages per line, 1-2
#     LateDiffusionDelay      delay per allpass stage, 10-100 ms
#     LateDiffusionFeedback   allpass feedback, 0-1
#     LateDiffusionModAmount  allpass delay modulation depth, 0-2.5 ms
#     LateDiffusionModRate    allpass delay modulation rate, 0-5 Hz
#
#   [preset.params.late_eq]  Late EQ: shelves and low-pass applied inside each line's feedback path.
#     LowShelfEnabled         on when >= 0.5: enables the low shelf
#     PostLowShelfGain        low shelf gain, 2-decade curve
#     PostLowShelfFrequency   low shelf corner, 20-1000 Hz
#     HighShelfEnabled        on when >= 0.5: enables the high shelf
#     PostHighShelfGain       high shelf gain, 2-decade curve
#     PostHighShelfFrequency  high shelf corner, 400-20000 Hz
#     CutoffEnabled           on when >= 0.5: enables the in-loop low-pass
#     PostCutoffFrequency     in-loop low-pass cutoff, 400-20000 Hz
#
#   [preset.params.seeds]  Random seeds: fix the tap/delay/diffusion patterns so a preset is reproducible.
#     TapSeed            early tap pattern seed, value x 1000000
#     DiffusionSeed      early diffuser seed, value x 1000000
#     DelaySeed          delay line length seed, value x 1000000
#     PostDiffusionSeed  late diffuser seed, value x 1000000
#     CrossSeed          blends each early seed series with a second one from the bitwise-complement
#                        seed (0 = TapSeed/DiffusionSeed series only, 1 = complement only): changes the
#                        early tap pattern and early diffuser. The delay lines and late diffusers
#                        ignore it in this mono fork
#
#   [preset.params.output]  Output mix: level of each stage in the final signal.
#     DryOut       dry signal level, 2-decade curve
#     PredelayOut  pre-delay tap level, 2-decade curve
#     EarlyOut     early reflection level, 2-decade curve
#     MainOut      late reverb level, 2-decade curve
#
#   [preset.params.delay_lines]  Delay line count (toggle target "delay_lines.max").
#     max   on when >= 0.5: max_delay_lines lines, else default_delay_lines
#
#   [preset.params.reverse]  Reverse voice ("reverse.enabled" on; "reverse.direct_mix" picks routing).
#     delay       reverse window length, 20-2000 ms (3-octave curve; 0.4771 = 500 ms)
#     enabled     on when >= 0.5: the reverse voice plays (default SWITCH_3 target)
#     direct_mix  on when >= 0.5: reversed reverb mixed into the output; off: reverse
#                 feeds the reverb tail (default SWITCH_4 target)
#
# TOGGLE TARGETS (values accepted in [preset.toggle_map]):
#   delay_lines.max                       delay line count (default SWITCH_1)
#   early.isReverse                       Bloom (default SWITCH_2)
#   reverse.enabled                       reverse voice on (default SWITCH_3)
#   reverse.direct_mix                    off = reverse feeds the reverb tail, on = reversed reverb
#                                         mixed into the output (default SWITCH_4)
#   input.HiPassEnabled                   while a toggle targets it, knobs on HighPass no longer switch it on
#   input.LowPassEnabled                  while a toggle targets it, knobs on LowPass no longer switch it on
#   early_diffusion.DiffusionEnabled      flipping clears the early diffuser's buffers
#   late_diffusion.LateDiffusionEnabled   flipping clears the late diffusers' buffers
#   early_diffusion.DiffusionStages       off = 1 allpass stage, on = 2; flipping overwrites the stored value with 0.0/1.0
#   late_diffusion.LateDiffusionStages    off = 1 allpass stage, on = 2; flipping overwrites the stored value with 0.0/1.0
#   late_eq.LowShelfEnabled               low shelf on the tail on/off
#   late_eq.HighShelfEnabled              high shelf on the tail on/off
#   late_eq.CutoffEnabled                 in-loop low-pass on the tail on/off
#   late.LateStageTap                     on = each line outputs before its delay (tail starts one LineDelay sooner)
#   late.Interpolation                    late-diffuser allpass interpolation on/off; more CPU
# Not toggle targets: continuous parameters (a toggle would slam them to 0/1; CrossSeed is one),
# LineCount (use delay_lines.max), reverse.delay (knob only), InputMix (no effect in mono).
#

# --------------------------------------------------------------------------
[[preset]]
name = "Chorus"
blinks = 1
led_on_ms = 150
led_off_ms = 150
led_pause_ms = 5000
default_delay_lines = 2.0
max_delay_lines = 5.0

# Knob assignments. Primary (_a) is the knob's normal function; secondary (_b)
# is active only while the preset footswitch (FS2) is held down.
[preset.knob_map]
knob1_a = "output.DryOut"
knob2_a = "output.EarlyOut"
knob3_a = "output.MainOut"
knob4_a = "late_diffusion.LateDiffusionFeedback"
knob5_a = "early.TapDecay"
knob6_a = "late.LineDecay"
knob1_b = "input.PreDelay"
knob2_b = "input.HighPass"
knob3_b = "input.LowPass"
knob4_b = "late.LineModAmount"
knob5_b = "late.LineModRate"
knob6_b = "reverse.delay"

# Toggle assignments. Primary (_a) is the switch's normal function; secondary (_b)
# is written by flipping the switch while the preset footswitch (FS2) is held down.
[preset.toggle_map]
toggle1_a = "delay_lines.max"
toggle2_a = "early.isReverse"
toggle3_a = "reverse.enabled"
toggle4_a = "reverse.direct_mix"
toggle1_b = "delay_lines.max"
toggle2_b = "early.isReverse"
toggle3_b = "reverse.enabled"
toggle4_b = "reverse.direct_mix"

# Input stage: pre-delay and the input filters feeding the whole reverb.
[preset.params.input]
InputMix       = 0.0
PreDelay       = 0.070000000298023224
HiPassEnabled  = 0.0
HighPass       = 0.0
LowPassEnabled = 0.0
LowPass        = 0.29000008106231689

# Early reflections: the multi-tap delay that follows the input stage.
[preset.params.early]
TapCount  = 0.36499997973442078
TapLength = 1.0
TapGain   = 1.0
TapDecay  = 0.86500012874603271
isReverse = 0.0

# Early diffusion: allpass chain that smears the early reflections.
[preset.params.early_diffusion]
DiffusionEnabled        = 1.0
DiffusionStages         = 0.4285714328289032
DiffusionDelay          = 0.43500006198883057
DiffusionFeedback       = 0.725000262260437
EarlyDiffusionModAmount = 0.50000005960464478
EarlyDiffusionModRate   = 0.42500010132789612

# Late reverb lines: the feedback delay network that generates the tail.
[preset.params.late]
LineDelay     = 0.68499988317489624
LineDecay     = 0.68000012636184692
LineModAmount = 0.59000003337860107
LineModRate   = 0.46999993920326233
LateStageTap  = 1.0
Interpolation = 0.0

# Late diffusion: allpass chain inside each delay line.
[preset.params.late_diffusion]
LateDiffusionEnabled   = 1.0
LateDiffusionStages    = 0.28571429848670959
LateDiffusionDelay     = 0.54499995708465576
LateDiffusionFeedback  = 0.65999996662139893
LateDiffusionModAmount = 0.619999885559082
LateDiffusionModRate   = 0.42500019073486328

# Late EQ: shelves and low-pass applied inside each line's feedback path.
[preset.params.late_eq]
LowShelfEnabled        = 0.0
PostLowShelfGain       = 0.5199999213218689
PostLowShelfFrequency  = 0.31499990820884705
HighShelfEnabled       = 0.0
PostHighShelfGain      = 0.83500003814697266
PostHighShelfFrequency = 0.73000013828277588
CutoffEnabled          = 1.0
PostCutoffFrequency    = 0.73499983549118042

# Random seeds: fix the tap/delay/diffusion patterns so a preset is reproducible.
[preset.params.seeds]
TapSeed           = 0.0011500000255182385
DiffusionSeed     = 0.00018899999849963933
DelaySeed         = 0.00033700000494718552
PostDiffusionSeed = 0.00050099997315555811
CrossSeed         = 0.0

# Output mix: level of each stage in the final signal.
[preset.params.output]
DryOut      = 0.94499987363815308
PredelayOut = 0.0
EarlyOut    = 0.77999997138977051
MainOut     = 0.74500006437301636

# Delay lines: stored state of the "delay_lines.max" toggle target
# (off = this preset's default_delay_lines, on = its max_delay_lines).
[preset.params.delay_lines]
max = 0.0

# Reverse voice: window length (knob target "reverse.delay") and the stored state of
# the toggle targets "reverse.enabled" (voice on) and "reverse.direct_mix" (routing).
[preset.params.reverse]
delay      = 0.4771
enabled    = 0.0
direct_mix = 0.0

